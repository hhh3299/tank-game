<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
  <meta name="theme-color" content="#05080d" />
  <title>坦克大战 · Tank Battle</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Crect width='100' height='100' rx='20' fill='%23071014'/%3E%3Crect x='24' y='34' width='52' height='36' rx='6' fill='%2334d399'/%3E%3Crect x='44' y='16' width='12' height='26' rx='4' fill='%23a7f3d0'/%3E%3C/svg%3E" />
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <main id="app">
    <header id="hud">
      <div class="stat"><span>得分</span><b id="score">0</b></div>
      <div class="stat"><span>关卡</span><b id="level">1</b></div>
      <div class="stat"><span>生命</span><b id="lives">3</b></div>
      <div class="stat"><span>敌军</span><b id="enemies">0</b></div>
      <div class="hud-actions">
        <button id="muteBtn" class="hud-btn" type="button" aria-label="静音" title="静音 (M)">🔊</button>
        <button id="pauseBtn" class="hud-btn" type="button" aria-label="暂停" title="暂停 (P)">⏸</button>
      </div>
    </header>

    <div id="stage">
      <canvas id="game" width="480" height="480"></canvas>
      <div id="overlay" class="show" aria-live="polite"></div>
    </div>

    <div id="touch">
      <div class="dpad">
        <button class="dbtn" data-dir="0" type="button" aria-label="向上">▲</button>
        <button class="dbtn" data-dir="3" type="button" aria-label="向左">◀</button>
        <button class="dbtn" data-dir="1" type="button" aria-label="向右">▶</button>
        <button class="dbtn" data-dir="2" type="button" aria-label="向下">▼</button>
      </div>
      <button id="fireBtn" type="button" aria-label="开火">开火</button>
    </div>

    <p class="hint">WASD / 方向键移动 · 空格 / J 开火 · P 暂停 · M 静音</p>
  </main>
  <script src="game.js"></script>
</body>
</html>
